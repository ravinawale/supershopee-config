spring:
    main:
        web-application-type: reactive
    cloud:
        gateway :
            discovery:
                locator:
                    enabled: true
                    lower-case-service-id: true
            routes:        
                  - id: auth-route
                    uri: lb://auth-service
                    predicates:
                        - Path=/auth/**
                    filters:
                        - name: Retry
                          args: 
                            retries: 3
                            method: GET
                            backoff:
                                firstBackOff: 50ms
                                maxBackOff: 500ms
                        - name: CircuitBreaker
                          args:
                            name: auth-service
                            fallbackUri: forward:/auth-fallback
                  - id: product-route
                    uri: lb://product-service
                    predicates :
                        - Path=/products/**
                    filters:
                        - name: AuthenticationFilter
                        - name: Retry
                          args:
                            retries: 3
                            methods: GET
                            backoff:
                                firstBackOff: 50ms
                                maxBackOff: 500ms
                        - name: CircuitBreaker
                          args:
                            name: product-service
                            fallbackUri: forward:/product-fallback
                  - id: order-service
                    uri: lb://order-service
                    predicates :
                        - Path=/orders/**
                    filters:
                        - name: AuthenticationFilter
                        - name: Retry
                          args:
                            retries: 3
                            methods: GET
                            backoff:
                                firstBackOff: 50ms
                                maxBackOff: 500ms
                        - name: CircuitBreaker
                          args:
                            name: order-service
                            fallbackUri: forward:/order-fallback 
    jackson :
        default-property-inclusion: NON_NULL
        
resilience4j:
  retry:
    metrics:
       enabled: true
       legacy:
          enabled: true
    configs:
      default:
        max-attempts: 3
        wait-duration: 5s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
         - java.util.concurrent.TimeoutException
        ignore-exceptions:
         - com.supershopee.gateway.exception.IgnoreException
    retry-aspect-order: 2
    instances:
        drug-details:
           baseConfig: default 
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 2s
        failureRateThreshold: 5
        eventConsumerBufferSize: 10
        slowCallDurationThreshold: 200ms
        slowCallRateThreshold: 30
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.io.IOException
        ignoreExceptions:
          - java.lang.IllegalStateException
    circuit-breaker-aspect-order: 1
    instances:
        drug-details:
            baseConfig: default        
#secret key - should be encrypted
jwt:
    secret: secretkey
    token:
        validity: 180000
